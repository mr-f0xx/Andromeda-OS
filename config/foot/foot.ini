# Amber CRT: warm phosphor on black, tuned for a 640x480 panel.
# A colour theme rather than a shader: it does not add scanlines or flicker.
font=DejaVu Sans Mono:size=11
pad=2x2 center
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
color=000000 ffb000

[colors]
background=000000
foreground=ffd36a
selection-foreground=000000
selection-background=ffb000
# Keep all ANSI colours in the amber family, with enough variation for
# terminal applications that use colour for syntax, warnings and status.
regular0=59400e
regular1=ff8c42
regular2=e8bd62
regular3=ffb000
regular4=d9a34a
regular5=edaa65
regular6=f2c77b
regular7=ffd36a
bright0=a8843e
bright1=ffae70
bright2=ffdc8a
bright3=ffd166
bright4=f4c978
bright5=ffd0a0
bright6=ffe0a3
bright7=fff0c2

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
